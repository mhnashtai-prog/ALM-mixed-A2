<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Daily Routines · Practice</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3ece0;--card:#fffaf1;--ink:#4b3f34;--mut:#8a7a69;--line:#e6dac8;--acc:#e29a52;--acc2:#f6dfc0;--ok:#78a95f;--bad:#d77c5a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a241e;--card:#37302a;--ink:#f3e9db;--mut:#b8a994;--line:#4a4137;--acc2:#4d3b27}}
:root[data-theme="dark"]{--bg:#2a241e;--card:#37302a;--ink:#f3e9db;--mut:#b8a994;--line:#4a4137;--acc2:#4d3b27}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:700 18px/1.4 'Nunito',ui-rounded,'SF Pro Rounded',system-ui,sans-serif}
header{padding:14px 14px 8px;max-width:680px;margin:auto}
h1{margin:0 0 2px;font-size:26px;font-weight:900}
.sub{color:var(--mut);font-size:16px;margin-bottom:10px}
#tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.tab{flex:1 0 auto;min-height:52px;padding:8px 14px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;font:inherit;font-size:16px;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{max-width:680px;margin:auto;padding:6px 14px 40px}
.card{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:22px;margin:12px 0;text-align:center}
.row{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 18px}
.row .em{font-size:34px}.w{font-weight:900;font-size:21px}.d{color:var(--mut);font-size:17px}
.big{font-size:26px;font-weight:900}.em.xl{font-size:68px;line-height:1.1}.hint{color:var(--mut);font-size:16px;margin-top:10px}
.flash{min-height:260px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;user-select:none}
.btn{min-height:54px;padding:10px 24px;border:0;border-radius:18px;background:var(--acc);color:#fff;font:inherit;font-weight:900;font-size:18px;cursor:pointer}
.btn.ghost{background:var(--acc2);color:var(--ink)}
.nav,.acts{display:flex;gap:10px;justify-content:center;margin-top:14px}.nav .btn,.acts .btn{flex:1}
.bar{display:flex;align-items:center;gap:10px;font-size:24px}
.trk{flex:1;height:18px;background:var(--line);border-radius:99px;overflow:hidden}.trk i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .5s}
.sw{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;min-height:52px;font-size:17px;cursor:pointer}
.sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer}
.sw b{width:58px;height:34px;border-radius:99px;background:var(--line);position:relative;transition:.25s}
.sw b::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.25s}
.sw input:checked+b{background:var(--acc)}.sw input:checked+b::after{left:28px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt>div{display:flex;flex-direction:column;gap:10px}
.tile{min-height:60px;padding:10px;border:2px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;font-weight:800;cursor:pointer}
.tile.sel{border-color:var(--acc);background:var(--acc2)}.tile.done{background:var(--ok);border-color:var(--ok);color:#fff;pointer-events:none}
.tile .em{font-size:30px}
.q{font-size:24px;font-weight:900;line-height:1.5;margin:8px 0 16px}.blank{display:inline-block;min-width:56px;border-bottom:4px solid var(--acc);text-decoration:none}
.inp{width:100%;min-height:58px;border:2px solid var(--line);border-radius:18px;background:var(--bg);color:var(--ink);font:inherit;font-size:20px;text-align:center;padding:8px 12px;outline:none}
.inp:focus{border-color:var(--acc)}
.built{min-height:70px;border:2px dashed var(--line);border-radius:18px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:12px 0}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.pool .tile,.built .tile{min-height:52px;padding:8px 16px}
.clock{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}
.clock svg{width:76px;height:76px;transform:rotate(-90deg)}.clock circle{fill:none;stroke-width:8}
#ring{stroke:var(--ok);stroke-linecap:round;stroke-dasharray:163.4;transition:stroke .3s}#ring.low{stroke:var(--bad)}
#sec{font-size:26px;font-weight:900;min-width:2ch}
#hint,.fb{min-height:28px;letter-spacing:3px;color:var(--mut);margin:8px 0;font-size:18px}.fb{letter-spacing:0;color:var(--bad)}
.shake{animation:sh .45s}@keyframes sh{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);background:var(--card);border:3px solid var(--acc);border-radius:24px;padding:14px 26px;font-size:26px;font-weight:900;opacity:0;pointer-events:none;transition:.25s;z-index:5;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:4}
.stars{font-size:44px;letter-spacing:4px;color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.gt{min-height:96px;font-size:15px;word-break:break-word}.seg{display:flex;gap:8px;margin-bottom:6px}.seg .tab{flex:1;padding:8px 6px;font-size:15px;white-space:normal}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px;background:#c9a07a;border-radius:26px;margin:10px 0}.sq{aspect-ratio:1.25;display:flex;align-items:center;justify-content:center;background:#1f1b18;color:#f3dcc3;border-radius:14px;font-weight:900;font-size:26px;transition:.3s}.sq.cur{background:var(--acc);color:#fff;box-shadow:inset 0 0 0 4px #fff;transform:scale(1.06)}.sq.ok{background:var(--ok);color:#fff}.sq.miss{background:#6b5a4c}.stats{display:flex;justify-content:space-between;align-items:center;font-size:17px;margin:8px 4px}.stats b{font-size:24px}
#sets{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.chip{flex:0 0 auto;min-height:46px;padding:6px 14px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;font:inherit;font-size:15px;cursor:pointer;white-space:nowrap}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media(prefers-reduced-motion:reduce){.shake{animation:none}}
</style></head><body>
<header><h1>☕ Daily Routines</h1><div class="sub">Cambridge practice · ages 17–30 · habits &amp; present simple</div>
<nav id="tabs"><button class="tab" data-m="view">📇 View &amp; List</button><button class="tab" data-m="match">🧩 Match</button><button class="tab" data-m="gap">⏱️ Gapfill</button><button class="tab" data-m="write">✍️ Write</button><button class="tab" data-m="prod">🧱 Productive</button><button class="tab" data-m="grid">🔓 Verb Grid</button><button class="tab" data-m="ch">🏆 Challenge</button><button class="tab" data-m="read">📖 Read</button></nav><div id="sets"></div></header>
<main id="app"></main><div id="toast"></div><canvas id="fx"></canvas>
<script>
const $=s=>document.querySelector(s),shuf=a=>[...a].sort(()=>Math.random()-.5);
let V=[["wake up","stop sleeping in the morning","⏰"],["get up","leave your bed","🛏️"],["brush my teeth","clean your teeth with a toothbrush","🪥"],["take a shower","wash your body under running water","🚿"],["get dressed","put your clothes on","👔"],["have breakfast","eat the first meal of the day","🥣"],["commute","travel to work or study","🚌"],["check my emails","read new messages on your computer","📧"],["do the laundry","wash dirty clothes","🧺"],["go to the gym","exercise in a fitness centre","🏋️"],["cook dinner","prepare the evening meal","🍳"],["scroll through social media","look at posts on your phone","📱"],["unwind","relax after a busy day","🛋️"],["go to bed","lie down to sleep","🌙"]];
let G=[{q:"I always br_sh my teeth after breakfast.",a:["u"],t:"Missing letter"},{q:"My brother ___ (get up) at six every day.",a:["gets up"],t:"Verb form"},{q:"She usually ___ (take) a shower in the evening.",a:["takes"],t:"Verb form"},{q:"I ___ the bus to work every morning.",a:["take","catch"],t:"Missing word"},{q:"He ___ (not / have) breakfast on weekdays.",a:["doesn't have","does not have"],t:"Verb form"},{q:"After work I like to unw_nd with a series.",a:["i"],t:"Missing letter"},{q:"They ___ (go) to the gym on Mondays.",a:["go"],t:"Verb form"},{q:"I always ___ the laundry on Sundays.",a:["do"],t:"Missing word"},{q:"My sister ___ (check) her emails first thing.",a:["checks"],t:"Verb form"},{q:"What time do you usually ___ to bed?",a:["go"],t:"Missing word"}];
let P=[["Say you usually wake up at six.",["I","usually","wake","up","at","six"]],["Say your sister never gets up early.",["My","sister","never","gets","up","early"]],["Ask how often they go to the gym.",["How","often","do","you","go","to","the","gym"]],["Say you always check your emails before breakfast.",["I","always","check","my","emails","before","breakfast"]],["Say he doesn't cook dinner on Fridays.",["He","doesn't","cook","dinner","on","Fridays"]],["Say you sometimes scroll through social media at night.",["I","sometimes","scroll","through","social","media","at","night"]],["Ask what time she gets dressed.",["What","time","does","she","get","dressed"]],["Say you usually unwind after a busy day.",["I","usually","unwind","after","a","busy","day"]]];
const MSG=['Great job! 🎉','Brilliant! ⭐','Well done! 👏','Spot on! 🌟','Perfect! 🥳','You nailed it! 🔥'];
const n=s=>s.toLowerCase().replace(/[’`]/g,"'").replace(/\b(my|your|his|her)\b/g,'my').replace(/\s+/g,' ').trim();
let mode='view',st={},T=0;const I={},R={};
/* effects */
const cv=$('#fx'),cx=cv.getContext('2d');let PT=[],raf=0;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);
function boom(x,y){const c=['#e29a52','#78a95f','#e26d6d','#f2c94c','#6fa8dc','#b68ad6'];for(let b=0;b<2;b++){const ox=x+(b?(Math.random()-.5)*180:0),oy=y+(b?(Math.random()-.5)*110:0);for(let i=0;i<42;i++){const a=Math.random()*6.283,s=2+Math.random()*5;PT.push({x:ox,y:oy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:c[Math.random()*6|0]})}}if(!raf)loop()}
function loop(){cx.clearRect(0,0,cv.width,cv.height);PT=PT.filter(p=>p.l>0);PT.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.vx*=.98;p.l-=.018;cx.globalAlpha=Math.max(p.l,0);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,3.5,0,6.283);cx.fill()});raf=PT.length?requestAnimationFrame(loop):0;if(!raf)cx.clearRect(0,0,cv.width,cv.height)}
let AC;function chime(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();[523,659,784,1047].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*.09;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.3)})}catch(e){}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1300)}
function win(el){const r=(el||document.body).getBoundingClientRect();boom(r.left+r.width/2,r.top+r.height/2);chime();toast(MSG[Math.random()*MSG.length|0])}
function bad(el,m){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');toast(m||'Almost! Try again 💪')}
function bar(d,t){const s=Math.round(d/t*5);return `<div class="bar"><span>🧺</span><div class="trk"><i style="width:${d/t*100}%"></i></div><span style="font-size:18px">${'★'.repeat(s)}${'☆'.repeat(5-s)}</span></div>`}
function fin(ok,t){clearInterval(T);const s=Math.max(1,Math.ceil(ok/t*5));$('#app').innerHTML=`<div class="card"><div class="em xl">🧺</div><div class="big">Basket full!</div><div class="stars">${'★'.repeat(s)}${'☆'.repeat(5-s)}</div><div class="d">${ok} of ${t} correct. Every round makes you stronger.</div><div class="acts"><button class="btn" onclick="setMode(mode)">Play again</button></div></div>`;boom(innerWidth/2,innerHeight/3);boom(innerWidth/3,innerHeight/4);chime()}
function setMode(m){mode=m;clearInterval(T);document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.m==m));I[m]()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
/* View & List */
I.view=()=>{st={i:0,f:0,list:0,seen:new Set([0])};R.view()};
R.view=()=>{const s=st;let h=`<label class="sw"><span>Cards</span><input type="checkbox" ${s.list?'checked':''} onchange="st.list=this.checked;R.view()"><b></b><span>List</span></label>`;
if(s.list)h+=V.map(v=>`<div class="card row"><div class="em">${v[2]}</div><div><div class="w">${v[0]}</div><div class="d">${v[1]}</div></div></div>`).join('');
else{const v=V[s.i];s.seen.add(s.i);h+=bar(s.seen.size,V.length)+`<div id="card" class="card flash" onclick="st.f^=1;R.view()">${s.f?`<div class="d big">${v[1]}</div><div class="hint">tap to flip back</div>`:`<div class="em xl">${v[2]}</div><div class="big">${v[0]}</div><div class="hint">tap to see the meaning</div>`}</div><div class="nav"><button class="btn ghost" onclick="go(-1)">← Back</button><button class="btn" onclick="go(1)">Next →</button></div>`}
$('#app').innerHTML=h};
function go(d){st.i=(st.i+d+V.length)%V.length;st.f=0;R.view()}
/* Match */
I.match=()=>{const p=shuf(V).slice(0,6);st={p,r:shuf(p),sel:null,done:[],emoji:0};R.match()};
R.match=()=>{const s=st;$('#app').innerHTML=`<label class="sw"><span>Definition</span><input type="checkbox" ${s.emoji?'checked':''} onchange="st.emoji=this.checked;R.match()"><b></b><span>Picture</span></label>`+bar(s.done.length,6)+`<div class="card"><div class="mt"><div>${s.p.map(v=>`<button class="tile ${s.done.includes(v[0])?'done':''} ${s.sel==v[0]?'sel':''}" onclick="mp('${v[0]}',0)">${v[0]}</button>`).join('')}</div><div>${s.r.map(v=>`<button class="tile ${s.done.includes(v[0])?'done':''}" onclick="mp('${v[0]}',1,this)">${s.emoji?`<span class="em">${v[2]}</span>`:v[1]}</button>`).join('')}</div></div></div>`};
function mp(k,side,el){if(side==0){st.sel=k;return R.match()}if(!st.sel)return toast('Pick a word first 👈');if(k==st.sel){st.done.push(k);win(el);st.sel=null;R.match();if(st.done.length==6)setTimeout(()=>fin(6,6),1300)}else bad(el,'Not a pair — try another 💪')}
/* Gapfill (timed) */
I.gap=()=>{st={l:shuf(G).slice(0,10),i:0,ok:0,t:20,lock:0};tick()};
function tick(){clearInterval(T);st.t=20;st.lock=0;R.gap();if(st.i>=st.l.length)return;T=setInterval(()=>{st.t-=.1;const r=$('#ring');if(r){r.style.strokeDashoffset=163.4*(1-Math.max(st.t,0)/20);$('#sec').textContent=Math.ceil(Math.max(st.t,0));r.classList.toggle('low',st.t<6)}if(st.t<=0){clearInterval(T);st.lock=1;$('#fb').textContent='Time is up — it was “'+st.l[st.i].a[0]+'”. Next one!';setTimeout(()=>{st.i++;tick()},2200)}},100)}
R.gap=()=>{const s=st;if(s.i>=s.l.length)return fin(s.ok,s.l.length);const g=s.l[s.i],q=g.q.replace(/_+/,'<u class="blank"></u>');$('#app').innerHTML=bar(s.i,s.l.length)+`<div id="card" class="card"><div class="clock"><svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="26" stroke="var(--line)"/><circle id="ring" cx="30" cy="30" r="26" style="stroke-dashoffset:0"/></svg><span id="sec">20</span><span style="font-size:28px">⏰</span></div><div class="d">${g.t}</div><div class="q">${q}</div><input id="in" class="inp" autocomplete="off" autocapitalize="off" ${g.t=='Missing letter'?'maxlength="1"':''} onkeydown="if(event.key=='Enter')subG()"><div id="fb" class="fb"></div><div class="acts"><button class="btn" onclick="subG()">Check</button></div></div>`;$('#in').focus()};
function subG(){if(st.lock)return;const g=st.l[st.i];if(g.a.map(n).includes(n($('#in').value))){clearInterval(T);st.lock=1;st.ok++;win($('#card'));setTimeout(()=>{st.i++;tick()},1500)}else bad($('#card'))}
/* Write */
I.write=()=>{st={l:shuf(V).slice(0,8),i:0,ok:0,h:0,lock:0};R.write()};
const ht=(w,h)=>h?w.split(' ').map(x=>x.split('').map((c,j)=>j<h-1?c:'_').join(' ')).join('    '):'';
R.write=()=>{const s=st;if(s.i>=s.l.length)return fin(s.ok,s.l.length);const v=s.l[s.i];s.h=0;s.lock=0;$('#app').innerHTML=bar(s.i,s.l.length)+`<div id="card" class="card"><div class="em xl">${v[2]}</div><div class="q">${v[1]}</div><div id="hint">&nbsp;</div><input id="in" class="inp" placeholder="Type the phrase…" autocomplete="off" autocapitalize="off" onkeydown="if(event.key=='Enter')subW()"><div class="acts"><button class="btn ghost" onclick="hintW()">💡 Hint</button><button class="btn" onclick="subW()">Check</button></div></div>`;$('#in').focus()};
function hintW(){const w=st.l[st.i][0];if(st.h<Math.max(...w.split(' ').map(x=>x.length)))st.h++;$('#hint').textContent=ht(w,st.h)}
function subW(){if(st.lock)return;const v=st.l[st.i];if(n($('#in').value)==n(v[0])){st.lock=1;st.ok++;win($('#card'));setTimeout(()=>{st.i++;R.write()},1500)}else bad($('#card'),'Nearly! Check the hint and try again 💪')}
/* Productive */
I.prod=()=>{st={l:shuf(P).slice(0,6),i:0,ok:0};setP()};
function setP(){const p=st.l[st.i];if(p){st.pool=shuf(p[1].map((_,k)=>k));st.b=[]}R.prod()}
R.prod=()=>{const s=st;if(s.i>=s.l.length)return fin(s.ok,s.l.length);const p=s.l[s.i],t=k=>`<button class="tile" onclick="mv(${k})">${p[1][k]}</button>`;$('#app').innerHTML=bar(s.i,s.l.length)+`<div id="card" class="card"><div class="d">Build the sentence</div><div class="q">${p[0]}</div><div class="hint" style="margin:-8px 0 8px">Tip: adverbs (usually, never…) go before the main verb. He/she/it + verb-s.</div><div class="built">${s.b.length?s.b.map(t).join(''):'<span class="d">Tap the words below</span>'}</div><div class="pool">${s.pool.map(t).join('')}</div><div class="acts"><button class="btn ghost" onclick="st.pool=shuf(st.l[st.i][1].map((_,k)=>k));st.b=[];R.prod()">Reset</button><button class="btn" onclick="subP()">Check</button></div></div>`};
function mv(k){const s=st;if(s.pool.includes(k)){s.pool=s.pool.filter(x=>x!=k);s.b.push(k)}else{s.b=s.b.filter(x=>x!=k);s.pool.push(k)}R.prod()}
function subP(){const w=st.l[st.i][1];if(st.b.map(k=>w[k]).join(' ')==w.join(' ')){st.ok++;win($('#card'));setTimeout(()=>{st.i++;setP()},1700)}else bad($('#card'),'Close! Move the words and try again 💪')}
/* Verb Grid */
let IV=[["TEA","drink","drank","drunk","🍵"],["BREAKFAST","eat","ate","eaten","🥣"],["A SHOWER","take","took","taken","🚿"],["THE BUS","catch","caught","caught","🚌"],["CLOTHES","wear","wore","worn","👔"],["AN EMAIL","write","wrote","written","📧"],["THE LAUNDRY","do","did","done","🧺"],["TO BED","go","went","gone","🌙"],["EIGHT HOURS","sleep","slept","slept","😴"],["COFFEE","buy","bought","bought","☕"],["A BOOK","read","read","read","📖"],["FRIENDS","meet","met","met","🤝"]];
const FN=['','Base form','Past simple','Past participle'];
I.grid=()=>{st={l:shuf(IV).slice(0,12),done:[],open:null,f:1,lock:0};R.grid()};
R.grid=()=>{const s=st;let h=`<div class="seg">${[1,2,3].map(f=>`<button class="tab ${s.f==f?'on':''}" onclick="gf(${f})">${FN[f]}</button>`).join('')}</div>`+bar(s.done.length,s.l.length)+`<div class="grid">${s.l.map((v,k)=>`<button class="tile gt ${s.done.includes(k)?'done':''} ${s.open===k?'sel':''}" onclick="gOpen(${k})"><span class="em">${v[4]}</span><br>${s.done.includes(k)?v[s.f]:v[0]}</button>`).join('')}</div>`;
if(s.open!==null){const v=s.l[s.open],a=v[s.f];h+=`<div id="card" class="card"><div class="em xl">${v[4]}</div><div class="big">${v[0]}</div><div class="d">${FN[s.f]} of the verb that goes with it</div><div class="q" style="letter-spacing:5px">${a[0].toUpperCase()}${'_'.repeat(a.length-1)}</div><input id="in" class="inp" placeholder="Type the verb…" autocomplete="off" autocapitalize="off" onkeydown="if(event.key=='Enter')gSub()"><div class="acts"><button class="btn" onclick="gSub()">Check</button></div></div>`}
